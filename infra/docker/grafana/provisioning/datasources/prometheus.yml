# Grafana Prometheus 数据源自动配置（CP6.4-pre-2）。
# 无需手工在 UI 里加 datasource，容器起来就自动生效。
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: stashbox-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
