# Alertmanager 告警路由（CP6.4-pre-2）。
# ⚠️ 飞书 webhook token 是占位符，CP1.8 才接真账号；本地 dev 阶段告警只在 Alertmanager UI 看。
global:
  resolve_timeout: 5m

route:
  receiver: "stashbox-feishu"
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "stashbox-feishu-critical"
      repeat_interval: 30m

receivers:
  - name: "stashbox-feishu"
    webhook_configs:
      # TODO(CP1.8): 换成真飞书机器人的 webhook 地址
      - url: "https://open.feishu.cn/open-apis/bot/v2/hook/STASHBOX_WEBHOOK_TOKEN"
        send_resolved: true

  - name: "stashbox-feishu-critical"
    webhook_configs:
      # TODO(CP1.8): 换成真 critical 告警群的 webhook 地址
      - url: "https://open.feishu.cn/open-apis/bot/v2/hook/STASHBOX_WEBHOOK_TOKEN_CRITICAL"
        send_resolved: true

inhibit_rules:
  # critical 已告警时，抑制同名的 warning，避免刷屏
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "service"]
