# Alertmanager 告警路由（CP6.4-pre-2 建，CP6.5.2 补 warning 路由 + 抑制/静默，2026-10-21 改 url_file）。
#
# ## 为什么改成 url_file
#
# 原来三个 receiver 的 webhook 地址是**写在配置文件里的占位符**
# （STASHBOX_WEBHOOK_TOKEN…）。那意味着：
# - 要接真告警，必须**改这个被 git 跟踪的配置文件**；
# - 改完之后 secret 就进了版本库；
# - 而且从配置里看不出"到底接没接"——占位符长得和真地址一模一样。
#
# `url_file` 是 Alertmanager 原生支持的：地址从**文件**里读。
# 于是：
# - secret 住在 `secrets/` 目录（部署时挂进去，不进版本库）；
# - 配置里不再出现任何地址，**一眼就能看出接没接**；
# - 换地址 = 改一个文件，不用动被跟踪的 yml。
#
# 三个文件各放一个群机器人地址（内容就是一行的 URL）：
#   secrets/feishu-webhook           兜底（severity 未打标签时）
#   secrets/feishu-webhook-critical  critical
#   secrets/feishu-webhook-warning   warning
#
# 仓库里放的是**占位地址**，所以 dev 栈照常起得来（告警发不出去，但
# 在 Alertmanager UI 里看得到）。deploy/preflight.sh 会检查这三个文件
# 是不是还是占位符 —— 是的话直接判 FAIL。
global:
  resolve_timeout: 5m

# 路由：按 severity 分流，critical / warning 各走独立 receiver。
# 分组 + 节流参数用于抑制告警噪音（v1 §10.5）：
#   group_by        同 alertname + service 的告警合成一条
#   group_wait      首次告警等 30s，攒够同组再发
#   group_interval  同组新增告警最快 5m 发一次
#   repeat_interval 未恢复告警每 4h 重复提醒一次（critical 单独收紧到 30m）
route:
  receiver: "stashbox-feishu"
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "stashbox-feishu-critical"
      repeat_interval: 30m
    - match:
        severity: warning
      receiver: "stashbox-feishu-warning"

receivers:
  # 兜底 receiver：severity 未打标签或值不在 critical/warning 时落到这里
  - name: "stashbox-feishu"
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/feishu-webhook
        send_resolved: true

  - name: "stashbox-feishu-critical"
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/feishu-webhook-critical
        send_resolved: true

  - name: "stashbox-feishu-warning"
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/feishu-webhook-warning
        send_resolved: true

inhibit_rules:
  # critical 已告警时，抑制同名的 warning，避免刷屏
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "service"]

# 静默规则（v1 §10.5 提到的"已知问题"）
# Alertmanager 的静默是运行时对象，不写在配置文件里，只能通过 UI / amtool 创建：
#   amtool silence add alertname=DistillTaskBacklog --duration=2h \
#     --comment="升级窗口期已知积压"
# 例如：升级窗口期 / 已知缺陷导致的告警，由 admin 手动加静默，避免改动本文件。
