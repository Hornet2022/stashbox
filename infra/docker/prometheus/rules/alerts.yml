# v1 §10.5 8 条核心告警规则（CP6.4-pre-2）。
#
# 说明：
#   - service label 来自 prometheus.yml static_configs（api-gateway / user-service / content-service / ai-service）
#   - ReadinessCheckFailing 依赖 blackbox_exporter 的 probe_success（未部署 → 空转）
#   - RedisConnectionFailing 依赖 redis_exporter 的 redis_up（未部署 → 空转）
#   - DistillTaskBacklog / LLMCostSpike 依赖 ai-service 后续接入的业务指标（CP3.5-pre-3+）
groups:
  - name: stashbox-core
    interval: 30s
    rules:
      # 1. API 5xx 错误率 > 1%
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{service=~"api-gateway|user-service|content-service|ai-service",status=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{service=~"api-gateway|user-service|content-service|ai-service"}[5m]))
            > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx 错误率 > 1%"
          description: "服务 {{ $labels.service }} 5xx 错误率 {{ $value | humanizePercentage }} 持续 2 分钟"

      # 2. API 4xx 错误率 > 5%
      - alert: HighClientErrorRate
        expr: |
          sum(rate(http_requests_total{service=~"api-gateway|user-service|content-service|ai-service",status=~"4.."}[5m]))
            /
          sum(rate(http_requests_total{service=~"api-gateway|user-service|content-service|ai-service"}[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API 4xx 错误率 > 5%"
          description: "4xx 错误率 {{ $value | humanizePercentage }} 持续 5 分钟"

      # 3. P95 延迟 > 1s
      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{service=~"api-gateway|user-service|content-service|ai-service"}[5m])) by (service, le)
          ) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} P95 延迟 > 1s"
          description: "{{ $labels.service }} P95 延迟 {{ $value }}s 持续 5 分钟（目标 < 1s）"

      # 4. 服务不可达（scrape 失败）
      - alert: ServiceDown
        expr: up{job=~"api-gateway|user-service|content-service|ai-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} 服务不可达"
          description: "Prometheus 连续 1 分钟抓不到 {{ $labels.instance }} 的 /metrics"

      # 5. 服务 readyz 失败（依赖 blackbox_exporter）
      - alert: ReadinessCheckFailing
        expr: probe_success{job=~"api-gateway|user-service|content-service|ai-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} readyz 检查失败"
          description: "/readyz 返回非 200（PG / Redis 依赖异常）持续 2 分钟"

      # 6. 蒸馏任务积压（AI queue 长度）
      - alert: DistillTaskBacklog
        expr: arq_jobs_in_queue{queue="stashbox:distill"} > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "蒸馏队列积压 {{ $value }} 个任务"
          description: "Arq 蒸馏队列长度 > 100 持续 5 分钟（阈值取 v1 §10.5）"

      # 7. LLM 调用成本飙升
      - alert: LLMCostSpike
        expr: |
          sum(rate(llm_cost_usd_total[1h])) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM 成本 1 小时 > $100"
          description: "按当前速率，1 小时 LLM 花费 {{ $value }} USD"

      # 8. Redis 连接失败（依赖 redis_exporter）
      - alert: RedisConnectionFailing
        expr: redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis 连接失败"
          description: "Redis exporter 探测失败持续 2 分钟（队列 / 缓存不可用）"

      # v1 §10.5 规则 5：blackbox 探测任意服务 down
      - alert: ServiceUnreachable
        expr: probe_success{service="blackbox"} == 0
        for: 1m
        labels:
          severity: critical
          rule: v1-10.5-rule-5
        annotations:
          summary: "服务 {{ $labels.instance }} 不可达"
          description: "blackbox 探测 {{ $labels.instance }} 失败超过 1 分钟（v1 §10.5 规则 5）"

      # v1 §10.5 规则 8：redis 不可达
      - alert: RedisDown
        expr: redis_up{service="redis"} == 0
        for: 30s
        labels:
          severity: critical
          rule: v1-10.5-rule-8
        annotations:
          summary: "Redis 不可达"
          description: "redis_exporter 探测 redis 失败超过 30 秒（v1 §10.5 规则 8）"

      # v1 §10.5 规则 8：redis 连接数过高
      - alert: RedisConnectionsHigh
        expr: redis_connected_clients{service="redis"} > 100
        for: 5m
        labels:
          severity: warning
          rule: v1-10.5-rule-8
        annotations:
          summary: "Redis 连接数过高（{{ $value }}）"
          description: "redis connected_clients 超过 100 持续 5 分钟（v1 §10.5 规则 8）"

      # === v1 §10.5 业务告警（CP6.5.1）===

      # 9. 蒸馏成功率 < 90% 持续 5 分钟（v1 §10.5 业务告警 1）
      - alert: DistillSuccessRateLow
        expr: |
          sum(rate(distill_success_total[5m]))
            /
          (sum(rate(distill_success_total[5m])) + sum(rate(distill_failure_total[5m])))
            < 0.9
        for: 5m
        labels:
          severity: critical
          rule: v1-10.5-distill-success
        annotations:
          summary: "蒸馏成功率 < 90% 持续 5 分钟"
          description: "当前 5 分钟蒸馏成功率 {{ $value | humanizePercentage }}（v1 §10.5 业务告警 1）"

      # 10. 蒸馏 P95 耗时 > 300s（5 分钟）持续 10 分钟（v1 §10.5 业务告警 2）
      - alert: DistillDurationP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(distill_step_duration_seconds_bucket[5m])) by (le, step)
          ) > 300
        for: 10m
        labels:
          severity: warning
          rule: v1-10.5-distill-duration
        annotations:
          summary: "蒸馏 P95 > 5 分钟（步骤 {{ $labels.step }}）"
          description: "步骤 {{ $labels.step }} P95 耗时 {{ $value }}s 持续 10 分钟（v1 §10.5 业务告警 2）"

      # 11. 单步失败率 > 10% 持续 5 分钟（v1 §10.5 业务告警 3）
      - alert: StepFailureRateHigh
        expr: |
          sum(rate(distill_failure_total[5m])) by (step)
            /
          sum(rate(distill_attempt_total[5m])) by (step)
            > 0.1
        for: 5m
        labels:
          severity: warning
          rule: v1-10.5-step-failure
        annotations:
          summary: "步骤 {{ $labels.step }} 失败率 > 10% 持续 5 分钟"
          description: "步骤 {{ $labels.step }} 失败率 {{ $value | humanizePercentage }}（v1 §10.5 业务告警 3）"

      # 12. OSS 存储 > 100GB（v1 §10.5 业务告警 6）
      # DISABLED：dev 环境无 oss-exporter 部署，对应 metric 不存在。
      # 启用条件：部署 oss-exporter + 在 prometheus.yml 添加对应 scrape job。
      # - alert: OSSStorageHigh
      #   expr: oss_storage_bytes > 107374182400  # 100GB
      #   labels:
      #     severity: warning
      #     rule: v1-10.5-oss-storage
      #   annotations:
      #     summary: "OSS 存储 > 100GB"
      #     description: "当前 {{ $value | humanize1024 }}B（v1 §10.5 业务告警 6）"

      # 13. 节点 CPU > 80% 持续 10 分钟（v1 §10.5 业务告警 7）
      # DISABLED：dev 环境无 node-exporter 部署，对应 metric 不存在。
      # 启用条件：部署 node-exporter + 在 prometheus.yml 添加对应 scrape job。
      # - alert: NodeCPUHigh
      #   expr: |
      #     100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
      #   for: 10m
      #   labels:
      #     severity: warning
      #     rule: v1-10.5-node-cpu
      #   annotations:
      #     summary: "节点 {{ $labels.instance }} CPU > 80%"
      #     description: "CPU 使用率 {{ $value }}% 持续 10 分钟（v1 §10.5 业务告警 7）"
