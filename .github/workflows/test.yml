# GitHub Actions: pytest workflow（CP1.3.1 / CP6.8 修 CI）
# 触发：PR + push to main
# 范围：backend/ + infra/
#
# CP6.8 修复点：
#   1. working-directory=backend 下 pytest 路径改 tests/（原来写成 backend/tests/ 必然找不到）
#   2. services 起 postgres:16-alpine + redis:7-alpine（带 health check，Actions 会等 healthy 再跑步骤）
#   3. 注入 DB/Redis 环境变量
#   4. pytest 前跑 alembic upgrade head 建表
#   5. pytest 统一走 poetry run（原来写 .venv/bin/pytest，但仓库没 poetry.toml，
#      poetry 默认把 venv 建在 ~/.cache/pypoetry，.venv/bin/pytest 并不存在）

name: Backend Tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/test.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stashbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stashbox_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DATABASE_URL / REDIS_URL 是按 CP6.8 要求显式声明的连接串。
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/stashbox_test
      REDIS_URL: redis://localhost:6379/0
      # 注意：backend/common/config.py 里 database_url / redis_url 是「计算属性」，
      # 由下面的 POSTGRES_* / REDIS_* 拼装而成，不读 DATABASE_URL / REDIS_URL
      # （SettingsConfigDict extra="ignore"）。所以真正生效的是这一组。
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stashbox_test
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_DB: '0'
      REDIS_PASSWORD: ''
      # backend 里的代码按 `stashbox.backend.*` 绝对包名导入，
      # 需要仓库根目录的父目录在 sys.path 上（同 tests/conftest.py 的 parents[3]）。
      PYTHONPATH: ${{ github.workspace }}/..
      # common/config.py 的 jwt_secret 校验器禁止用默认 dev 密钥（否则任何人
      # 都能伪造 token），它的 docstring 明确写了「CI / 集成测试用
      # STASHBOX_ALLOW_DEV_JWT=1 显式放行」—— 就是这一行。
      #
      # 2026-10 之前 CI 一直没设它，于是 `alembic upgrade head` 在
      # import config 阶段就 ValidationError 退出 1，后面两个 pytest 步骤
      # 根本轮不到跑。这个红点在 job 列表里看起来像「数据库迁移坏了」，
      # 和真正原因（少一个环境变量）毫无关系，很容易被误判成偶发。
      #
      # 选它而不是往仓库里写死一个 JWT_SECRET 字面量：不在仓库里留任何
      # 看起来像密钥的东西，误拷到生产的可能性为零。
      STASHBOX_ALLOW_DEV_JWT: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry

      # ffmpeg 不是「可选的测试依赖」：ai-service/distill/steps.py 的
      # 音频分段拼接与时长探测真的调它（`_find_bin` 会在 PATH 和几个常见
      # 目录里找 ffmpeg/ffprobe）。开发机有 homebrew 所以一直绿，CI 上没有 →
      # 6 个 audio_variant / tts 用例 FileNotFoundError。
      #
      # 不用「找不到就 skip」处理：这些用例测的正是 ffmpeg 行为，skip 掉等于
      # 把音频链路完全交给人工验证。装它。
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Run alembic upgrade head
        working-directory: backend
        run: poetry run alembic upgrade head

      - name: Run pytest (tests/)
        working-directory: backend
        # 2026-10 收敛忽略清单。原版按注释「跳过 collection error 的目录
        # （pre-existing 已知）」硬编码了 5 条 --ignore，其中 4 条早已失效：
        #   content / gateway / observability / test_quota.py
        # 它们当初被 ignore 是因为收集期报错；问题修掉后没人回来清理，
        # 于是 215 个用例长期在 CI 之外。ignore 清单替 bug 兜了底，
        # 也让 bug 永远暴露不出来。
        #
        # 真机 e2e 不再需要 --ignore：tests/e2e/conftest.py 的生产守卫已从
        # `raise RuntimeError` 改为 `pytest.skip(allow_module_level=True)`。
        # 原来抛异常发生在收集期，会连带中断其余 1000+ 个用例（CI 退出码 2）。
        #
        # `-m "not network"`：排除标记为 network 的真出网用例。
        # 目前 tests/ 下没有这种用例，加它是为了将来有人加的时候自动生效，
        # 而不用再改 workflow（那正是本次事故的机制）。
        #
        # STASHBOX_E2E_SKIP_DEVICE=1：无真机时只跑不需要设备的用例。
        env:
          STASHBOX_E2E_SKIP_DEVICE: "1"
        run: |
          poetry run pytest tests/ \
            -m "not network" \
            --junitxml=pytest-report.xml \
            -v

      - name: Run pytest (content-service/tests/)
        working-directory: backend
        # 同一批问题换了个位置：content-service/tests/ 有 150 个用例，
        # 2026-10 之前**整目录**不在 CI 里。真正该排除的只有
        # integration/test_fetch_e2e.py 一个文件 —— 它打的是 techcrunch.com /
        # news.sina.com.cn 等 10 个真实站点，外部抖动会让 job 随机变红，
        # 而它对「本仓代码有没有坏」提供不了稳定信号。
        #
        # 所以改成在代码里打 pytest.mark.network（见 pyproject.toml 的
        # markers 注册），CI 只按标记排除。依据写在代码里而不是 workflow
        # 注释里 —— 上一轮丢信号就是因为「该跑什么」只存在于注释中。
        #
        # **必须与 tests/ 分两次跑**，不能合成一条命令：
        # content-service/tests/fetchers/ 目录名就叫 `fetchers`，与真实的
        # content-service/fetchers 包同名。同一进程里收集两棵树时，
        # sys.path 的先后顺序决定谁顶掉谁，9 个模块直接
        # ModuleNotFoundError（test_wechat_mp_handler.py 头部注释记了同一件事）。
        # 分开跑则各自沿用原有的 path 假设，行为与本地单跑一致。
        env:
          STASHBOX_E2E_SKIP_DEVICE: "1"
        run: |
          poetry run pytest content-service/tests/ \
            -m "not network" \
            --junitxml=pytest-content-service-report.xml \
            -v

      - name: Report pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          # 两棵树的报告分开上传：合成一个文件时，后跑的那棵树会覆盖前一棵，
          # 于是「只有 content-service 的报告」这种情况看起来完全正常。
          path: |
            backend/pytest-report.xml
            backend/pytest-content-service-report.xml
        continue-on-error: true
