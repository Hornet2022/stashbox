# Stashbox 网关的 nginx 反向代理（HTTPS 入口）
# =================================================
#
# 装法（root）：
#     cp nginx.conf /etc/nginx/sites-available/stashbox
#     ln -s /etc/nginx/sites-available/stashbox /etc/nginx/sites-enabled/stashbox
#     nginx -t && systemctl reload nginx
#
# 为什么必须是 HTTPS（不是"建议"，是"必须"）：
#   安卓 release 构建默认**拒绝明文 HTTP**（cleartext traffic not permitted），
#   所以公网入口只能是 TLS —— 否则安卓端连不上，表现为"网络错误"。
#   证书用 acme.sh 签（这台机器的 certbot 续期目录是坏的，别用）：
#       bash /opt/stashbox/deploy/issue-domain-cert.sh
#   ⚠️ 备案期间**域名的 80 端口**被阿里云拦（HTTP-01 走不通）→
#     域名证书实际走 TLS-ALPN-01（443）；IP 证书照旧走 HTTP-01。
#
# 为什么 nginx 在前面、网关只监听 127.0.0.1：
#   1) 只有 nginx 需要占 80/443（阿里云轻量服务器防火墙也只放这两个）；
#      8100-8103 留在回环，公网连不到 —— 少一层暴露面。
#   2) nginx 是唯一会设置 X-Forwarded-For 的上游，uvicorn 只采信
#      TRUSTED_PROXY_IPS 里列的对端（这里是 127.0.0.1）。
#
# ⚠️ X-Forwarded-For 必须**覆盖**（$remote_addr），不能追加
#   （$proxy_add_x_forwarded_for）。追加等于让客户端自己往 XFF 里塞一个
#   假的来源 IP，登录限流（按 IP 计数）就被绕过了。
#   有阿里云 SLB 挡在前面时，见下面 real_ip 那段。

# 上游：网关（systemd 单元 stashbox-api-gateway.service）
upstream stashbox_gateway {
    server 127.0.0.1:8100 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# ── TLS 证书选择 ─────────────────────────────────────────────────────
#
# 两种情形，用同一份 nginx 配置都能跑：
#
#   · 域名证书（4 个名字，90 天）→ 域名块（公开面 / API / 后台）
#     /etc/letsencrypt/live/stashbox.cn/{fullchain,privkey}.pem
#     由 acme.sh 签发并由 deploy/renew-tls.sh 自动续期。
#     **备案期间域名的 80 端口被阿里云拦** → HTTP-01 走不通
#     → 实际走 TLS-ALPN-01（验证走 443，443 不拦）。
#
#   · IP 证书（6 天）→ IP 兜底块（server_name _）
#     /etc/letsencrypt/live/8.148.9.151/{fullchain,privkey}.pem
#     HTTP-01 验证。IP 没有备案概念 → 80 端口**不被拦**。
#     续期卡到 4 天一次（LE 对 IP 证书的重复证书配额是每周 5 张）。
#
# 两张证书的 SAN 不重叠 → 域名块**直接写证书路径**，不走共用片段；
# IP 兜底块才 include /etc/nginx/snippets/tls-cert.conf。
include /etc/nginx/snippets/tls-cert.conf;

# ⚠️ HTTP/2 的写法与 nginx 版本有关：
#   · nginx 1.24（Ubuntu 24.04 自带）：`listen 443 ssl http2;`
#   · nginx 1.25.1+：          `listen 443 ssl;` + `http2 on;`
#   写错版本 → `nginx -t` 直接 emerg: unknown directive "http2"。
#   本文件按 **1.24** 写（目标机器是 Ubuntu 24.04 轻量应用服务器）。

# 登录接口的粗粒度限速（防御纵深）。
# 真正的限流在网关里（STASHBOX_LOGIN_RATE_LIMIT，按真实 IP 精确计数）；
# 这里只是挡一眼扫过来的脚本，阈值给得比正常用高一个数量级，
# 不会误伤正常用户。
limit_req_zone $binary_remote_addr zone=stashbox_auth:10m rate=30r/s;

# ── 80：只做跳转 + ACME 续签 ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.stashbox.cn;

    # ACME HTTP-01 验证要走这个路径，别把它也跳转了。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443：真正的入口 ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.stashbox.cn;

    # ── TLS ──────────────────────────────────────────────────────────
    # 证书路径换成 acme.sh 实际签发的那一对。
    include /etc/nginx/snippets/tls-cert.conf;

    # 只留 TLS 1.2 / 1.3（1.0/1.1 已被主流客户端判为不安全）。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;          # TLS1.3 的 cipher 由客户端决定
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── 安全响应头 ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── 真实客户端 IP（**只有** SLB / ingress 在前面时才需要）─────────
    # 没有 SLB 时下面两行保持注释：$remote_addr 就是真实的客户端 IP。
    # 有 SLB 时打开，并把网段换成你的 SLB 网段（阿里云 SLB 的网段在
    # 控制台的 "实例详情 → 基本信息" 里给），这样 $remote_addr 会被
    # 改写成 SLB 传过来的真实客户端 IP，X-Forwarded-For 也就对了。
    # set_real_ip_from 47.98.0.0/16;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # ── 请求体 ───────────────────────────────────────────────────────
    # 剪藏是 POST 一篇文章进来，默认 1m 太小（长文 + 封面图会 413）。
    client_max_body_size 10m;
    client_body_timeout 30s;

    # ── 转发到网关 ────────────────────────────────────────────────────
    # proxy_set_header 写在 server 层、location 层没有再写 —— nginx 的
    # proxy_set_header 是"上一层没定义才继承"，所以两个 location 都会拿到
    # 同一组头，不会走样。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # ⚠️ **覆盖**（$remote_addr），不是追加（$proxy_add_x_forwarded_for）。
    #    追加等于让客户端自己往 XFF 里塞一个假来源 IP → 登录限流可被绕过。
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;

    location = /api/v1/auth/token {
        limit_req zone=stashbox_auth burst=60 nodelay;
        proxy_pass http://stashbox_gateway;
    }

    # ── 音频（本地存储模式）────────────────────────────────────────
    #
    # STORAGE_PROVIDER=local 时，音频由网关的静态路由提供
    # （api-gateway/main.py:163 挂载 /audio → LOCAL_AUDIO_DIR）。
    # nginx 的 root 下没有这个目录，所以**必须**显式转给网关，
    # 否则客户端拿到 404（表现为「文章有音频但播不了」）。
    #
    # ⚠️ 用 OSS 模式时这段不生效（audio_url 是 OSS 的 presigned URL，
    #    客户端直连 OSS，不经过本机）。
    location /api/ {
        proxy_pass http://stashbox_gateway;
    }

    location ~ ^/(healthz|readyz|health|metrics)$ {
        proxy_pass http://stashbox_gateway;
    }

    location /audio/ {
        proxy_pass http://stashbox_gateway;
        # 音频是完整文件下载，不要缓冲整个响应到内存
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ── APK 静态托管（应用内更新用）────────────────────────────────
    #
    # 安卓端 GET /api/v1/app/version 拿到 download_url 后直接下载这个文件。
    # 放这里而不是对象存储，是为了内测期少一个外部依赖（换版本时
    # scp 一下就行）；等发版频繁了再挪到 OSS。
    # APK 下载（应用内更新用）—— 三个入口都要有。
    #
    # ⚠️ 漏了的话 /downloads/*.apk 会落到下面的 try_files → 返回 index.html，
    #    客户端拿到 2697 字节的 HTML 而不是 3.7MB 的 APK，
    #    而且 **HTTP 状态码还是 200** —— 日志里完全看不出异常，
    #    表现为"下载下来装不上"（解析 APK 失败）。
    include /etc/nginx/snippets/stashbox-downloads-redirect.conf;


    location / {
        proxy_pass http://stashbox_gateway;
    }

    # ── 超时 ────────────────────────────────────────────────────────
    # proxy_read_timeout 必须**大于**网关自己的下游超时
    # （STASHBOX_GATEWAY_UPSTREAM_TIMEOUT，2 GiB 模板里是 45s），
    # 否则 nginx 会先掐断请求，后端还在算 —— 客户端拿到 504，
    # 而后端日志里一切正常，最难查的那种故障。
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 90s;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # ── 日志 ────────────────────────────────────────────────────────
    access_log /var/log/nginx/stashbox.access.log stashbox;
    error_log  /var/log/nginx/stashbox.error.log warn;
}

# ── 临时：IP 直连入口（备案期间用）────────────────────────────────
#
# 备案没通过时，域名解析到这台机器会被阿里云监测系统阻断（80/443 封着），
# 所以后台和 API 在备案通过前**无法用域名访问**。
#
# 这个 server 块让 `https://<公网IP>/` 直接是管理后台，
# `https://<公网IP>/api/...` 直接是 API —— 不用改 hosts、不用等备案。
#
# ⚠️ 证书是自签的，浏览器会警告「不安全」，点「高级 → 继续前往」即可。
#    登录信息走 Authorization header（localStorage），不依赖 cookie，
#    所以自签证书不影响功能。
#
# ⚠️ 备案通过后请**删掉这个 server 块**（它把整个 IP 暴露在公网上，
#    任何人拿到 IP 都能看到后台登录页）。删之前记得确认域名已能访问。
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # IP 兜底入口用 **IP 证书**（IP 入口与域名入口主机名不同，必须各用各的）
    include /etc/nginx/snippets/tls-cert.conf;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;
    client_body_timeout 30s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;

    root /var/www/stashbox-admin;
    index index.html;

    # API 走网关
    location /api/ {
        proxy_pass http://stashbox_gateway;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 90s;
    }

    # 音频（本地存储模式）—— **必须加**。
    # 漏了的话 /audio/* 会落到下面的 try_files → 返回 index.html（text/html），
    # 客户端拿到的是 HTML 而不是音频，表现为"点播放没声音/解析失败"。
    # （IP 直连入口是 default_server，域名入口那边已经配了这段。）
    location /audio/ {
        proxy_pass http://stashbox_gateway;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # APK 下载（应用内更新用）—— 三个入口都要有。
    #
    # ⚠️ 漏了的话 /downloads/*.apk 会落到下面的 try_files → 返回 index.html，
    #    客户端拿到 2697 字节的 HTML 而不是 3.7MB 的 APK，
    #    而且 **HTTP 状态码还是 200** —— 日志里完全看不出异常，
    #    表现为"下载下来装不上"（解析 APK 失败）。
    include /etc/nginx/snippets/stashbox-downloads.conf;

    # 其余是后台静态文件（SPA 回退）
    location ~ ^/(healthz|readyz|health|metrics)$ {
        proxy_pass http://stashbox_gateway;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    access_log /var/log/nginx/stashbox-ip.access.log stashbox;
    error_log  /var/log/nginx/stashbox-ip.error.log warn;
}

# ── 管理后台（独立子域 admin.stashbox.cn）────────────────────────────
#
# 为什么单独一个 server 块而不是挂在 api.stashbox.cn/admin/ 下：
#   管理后台是 BrowserRouter 的 SPA（src/App.tsx:159），
#   挂在子路径下要改 vite base + react-router basename，两处都得动；
#   独立子域则**前端一行代码都不用改**（vite 默认 base='/'）。
#
# 部署物：vite build 的 dist/ 内容放 /var/www/stashbox-admin
#   pnpm build && sudo rsync -a --delete dist/ root@<host>:/var/www/stashbox-admin/
#
# ⚠️ 构建时必须把 API 地址指向**对外**的网关地址，编译期就写死在
#    bundle 里（src/api/client.ts:27 读 VITE_API_BASE_URL）：
#    VITE_API_BASE_URL=https://api.stashbox.cn pnpm build
#    不然后台会去打 http://localhost:8100 —— 在浏览器里必然连不上。
#
# ⚠️ 证书：四个名字**一张证书**（它们复用同一个证书文件，
#    SAN 少一个就报证书失配）：
#    bash /opt/stashbox/deploy/issue-domain-cert.sh
#    备案期间会临时停 nginx（ALPN 要独占 443），签完自动起回来。
server {
    listen 80;
    listen [::]:80;
    server_name admin.stashbox.cn;

    # ACME HTTP-01 验证路径
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.stashbox.cn;

    include /etc/nginx/snippets/tls-cert.conf;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 管理后台不用 HSTS 到最长（它只是内测工具，
    # 万一证书出问题好回退），但其余安全头与 API 侧一致。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/stashbox-admin;
    index index.html;

    # APK 下载（应用内更新用）—— 三个入口都要有。
    #
    # ⚠️ 漏了的话 /downloads/*.apk 会落到下面的 try_files → 返回 index.html，
    #    客户端拿到 2697 字节的 HTML 而不是 3.7MB 的 APK，
    #    而且 **HTTP 状态码还是 200** —— 日志里完全看不出异常，
    #    表现为"下载下来装不上"（解析 APK 失败）。
    include /etc/nginx/snippets/stashbox-downloads-redirect.conf;

    # SPA 回退：前端路由（/users、/push…）直接刷新也要能出页面。
    # 注意这里**不能**吞掉 /api/ —— 管理后台的 API 走的是
    # VITE_API_BASE_URL 指向的 api.stashbox.cn（跨域），
    # 本 server 块不代理 /api/，所以不冲突。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物（vite 默认）—— 长缓存 + 内容 hash 文件名
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 绝不能缓存 —— 否则发了新版本用户还拿到旧的
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    access_log /var/log/nginx/stashbox-admin.access.log stashbox;
    error_log  /var/log/nginx/stashbox-admin.error.log warn;
}
