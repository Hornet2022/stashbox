# APK 下载路由（共享片段）—— 被 deploy/systemd/nginx.conf 的三个 server 块 include
#
# 为什么抽成共享片段：
#   三个入口（api 域名 / 营销页域名 / admin 域名 / IP 直连）**都要**有这段。
#   漏了的话 /downloads/*.apk 会落到 SPA 的 try_files → 返回 index.html，
#   客户端拿到 2.7KB 的 HTML 而不是 3.8MB 的 APK，
#   而且 **HTTP 状态码还是 200** —— 日志里完全看不出异常，
#   表现为"下载下来装不上"（解析 APK 失败）。
#   这个坑已经踩过两次（/audio/ 和 /downloads/），所以抽成共享片段。
#
# ⚠️ **这个文件以前只存在于服务器上**（/etc/nginx/snippets/stashbox-downloads.conf），
#    仓库里没有 → 服务器重建/换机就会把这条路由弄丢，而且是"200 + HTML"
#    这种最难发现的坏法。现在它跟着 nginx.conf 一起进仓库（见 nginx.conf 的
#    include 路径），部署时必须一起装：
#        sudo mkdir -p /etc/nginx/snippets
#        sudo cp deploy/systemd/snippets/stashbox-downloads.conf /etc/nginx/snippets/
#        nginx -t && systemctl reload nginx
#
# 安装位置：/etc/nginx/snippets/stashbox-downloads.conf
# 装到哪台机器：公网入口那台（8.148.9.151），不是本地开发机。

location /downloads/ {
    alias /var/www/stashbox-downloads/;

    # APK 3.8MB，直接读盘别缓冲进内存（这台只有 1.6GB）
    sendfile on;

    # APK 是已压缩的 ZIP，再 gzip 一遍纯浪费这台 2 核机器的 CPU
    # （主配置的 gzip_types 默认也不含这个类型，这里显式关掉是防以后被人加进去）
    gzip off;

    # 正确的 MIME（安卓端要靠它判断是不是 APK）
    default_type "application/vnd.android.package-archive";

    # 让浏览器把 APK 存成文件而不是试图渲染
    add_header Content-Disposition "attachment";

    # 重复下载不再每次重传 3.8MB（ETag 也在，客户端仍能拿到 304）
    add_header Cache-Control "public, max-age=3600" always;

    # ⚠️ **nginx 的 add_header 不继承**：location 里只要出现一条 add_header，
    #    **server 层的 add_header 就整组失效**（不是合并，是被覆盖）。
    #    所以这里必须把 server 层的几条安全头**重新声明一遍** ——
    #    否则 /downloads/ 的响应一个安全头都没有（HSTS 尤其要紧：
    #    少了它，浏览器不会对这个下载域名做 HTTPS 固定）。
    #    实测：加之前，APK 响应里确实没有 strict-transport-security。
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
