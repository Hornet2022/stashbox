# APK 下载：**域名入口一律 302 到 IP 入口**（备案通过前）
#
# ## 为什么
# 2026-10-22 实测：域名（未备案）在 443 上的**大流量**会被掐/限速 ——
#   同一个 IP、同一个网络、同一个文件：
#     GET /downloads/…apk  200  3836512  AndroidDownloadManager/16  ← 完整下完
#     GET /downloads/…apk  200   147456  MiuiBrowser                 ← 断
#   而**小请求**（9.6KB 的落地页）在同一个域名上完全正常。
#   服务器侧全清白：无 OOM、nginx 没重启、Range 206 正常、出网流量 578MB
#   远未到配额。→ 是「未备案域名的流量」被区别对待。
#
# ## 为什么是 302 而不是把落地页链接直接写成 IP
#   · 落地页的链接仍然是域名 → 好看、能被分享、能被爬虫收录
#   · 下载动作自动落到 IP → 用户无感，且**所有入口**统一
#   · App 内的下载（应用内更新）走自己的兜底，不经过这里
#
# ## 备案通过后
# 把三个域名块的 include 换回 stashbox-downloads.conf（直出）即可，
# 并删掉这个文件。**别忘了同时把落地页的备用链接和
# STASHBOX_APP_DOWNLOAD_URL 换回域名。**

location /downloads/ {
    # $request_uri 带原路径与 query
    return 302 https://8.148.9.151$request_uri;
}
