# sysusers.d 片段：创建 Stashbox 的服务用户。
#
# 装法（root）：
#     install -m 0644 stashbox-user.conf /etc/sysusers.d/stashbox.conf
#     systemd-sysusers
#     # 或者一次性执行（等价）：
#     useradd --system --user-group --home-dir /opt/stashbox \
#             --shell /usr/sbin/nologin stashbox
#
# 为什么用系统用户（--system）：
#   · UID 从 100 段分配，低于 1000，UID 小的用户不能登录（sshd 的 PermitRootLogin
#     / 发行版默认策略都挡）；
#   · 没有密码（!），没有 home 里的 .bashrc，shell 是 nologin；
#   · 5 个 unit 全部以它运行 —— 应用代码永远拿不到 root 权限。
#
# home-dir 指向 /opt/stashbox（代码 + venv 的父目录），不是 /home：
#   配合 systemd 的 ProtectHome=true（/home /root /run/user 全部不可见）
#   服务根本碰不到任何用户的家目录。
#
# id stashbox  → 查 uid/gid
# 改完记得：systemctl daemon-reload && systemctl restart stashbox-*.service

u stashbox - "Stashbox service account" /opt/stashbox /usr/sbin/nologin
