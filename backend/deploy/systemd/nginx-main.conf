# nginx 主配置（这台机器的）
#
# ## 为什么它现在在仓库里
# 2026-10-22 之前它只存在于服务器上 → 换机/重建就会丢，而丢掉的偏偏是
# **观测能力**：默认 log_format 不含 $host 与 $request_time，于是
#   · 看不出一次请求走的是**域名还是 IP**（这两个 host 走完全不同的线路）
#   · 看不出**服务端自己花了多久**（于是「下载慢」只能猜是服务器慢还是
#     链路慢 —— 而实测那次是客户端浏览器下载器的问题，猜错方向就改错地方）
#
# ## 那个 log_format 里加了什么
#   host=$host               这次请求的 Host 头 → 区分域名入口 / IP 入口
#   rt=$request_time         服务端从读到写完的总耗时（秒，3 位小数）
#   urt=$upstream_response_time  转发给上游的耗时（直出静态文件时为空）
#
# 排查「下载不动 / 卡住」这类问题时，这两个字段是决定性的：
# rt 大 = 服务器慢；rt 小但客户端断 = 链路或客户端下载器的问题。
#
# 装法：
#   sudo cp deploy/systemd/nginx-main.conf /etc/nginx/nginx.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 改 log_format 后，**所有** access_log 指令都要显式带上格式名
#    （否则它们会覆盖 http 块的默认值，继续用内置 combined）。
#    站点配置在 deploy/systemd/nginx.conf 与 deploy/patch-nginx-site.py 里。

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;
	gzip on;
	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

	# ── 访问日志格式（2026-10-22）────────────────────────────────────
	#
	# 内置的 combined 缺两个关键字段：
	#   · $host —— 同一台机器上有 4 个入口（api / www / admin / IP），
	#     不记 Host 就没法判断「这次请求走的是哪条线路」。
	#   · $request_time —— 服务端处理耗时。有了它才能把
	#     「服务端慢」和「链路/客户端慢」分开 —— 这两者的修法完全不同。
	log_format stashbox
		'$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
		'"$http_referer" "$http_user_agent" '
		'host=$host rt=$request_time urt=$upstream_response_time';

	access_log /var/log/nginx/access.log stashbox;
}
