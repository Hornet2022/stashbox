[tool.poetry]
name = "stashbox-backend"
version = "0.1.0"
description = "Stashbox backend - AI audio subscription platform"
authors = ["Huang Feng <hornetyyq@qq.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
alembic = "^1.14.0"
redis = "^5.2.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
httpx = "^0.28.0"
python-multipart = "^0.0.20"
loguru = "^0.7.2"
prometheus-client = "^0.21.0"
structlog = "^24.1.0"
arq = "^0.26.0"
langfuse = "^2.57.0"
# CP11.0.8 P3.3: PDF 抓取器依赖
pypdf = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
# tests/test_openapi_export.py 用（CP6.6）。也列在 backend/requirements.txt，
# 但 CI 走 `poetry install`，不装 requirements.txt —— 缺了会在 collection 阶段
# ImportError 直接中断整轮 pytest（CP6.10 定位）。
openapi-spec-validator = "^0.7.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# 这两个文件在 import stashbox.* 之前必须先改 sys.path（CP-ENV-CWD：
# 服务以 `python -m uvicorn <svc>.main:app` 从各自目录启动，仓库根不在
# 默认 import 路径上）。E402 在这里是有意为之，不是笔误。
"api-gateway/main.py" = ["E402"]
"ai-service/distill/steps.py" = ["E402"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
