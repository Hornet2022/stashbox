[tool.poetry]
name = "stashbox-backend"
version = "0.1.0"
description = "Stashbox backend - AI audio subscription platform"
authors = ["Huang Feng <hornetyyq@qq.com>"]
package-mode = false

# ── 版本下限的依据（2026-10 统一）──────────────────────────────────────────
#
# 下面这些下限**不是**随手写的，它们等于本机 backend/.venv 里实际安装、
# 且 1160 个用例全绿时的那套版本。此前声明写的是更老的一批（fastapi ^0.115、
# pytest ^8、pytest-asyncio ^0.24、structlog ^24 …），但代码一直在新版本上跑 ——
# 老版本只是「声明里好看」。CI 按老声明装完的结果是 106 条失败/错误
# （其中 37 条与缺包无关，全是版本差异：pydantic-settings 报
# illegal environment variable name、pytest 报 path-like args is not allowed）。
#
# 所以定这条规矩：**声明必须与被验证过的环境一致**，否则「本地全绿」对 CI 毫无
# 说服力 —— 那只是因为两边跑的不是同一套东西。
#
# 改动这里的版本后，请同步 backend/.venv（pip install 对应版本）并跑一遍两棵树，
# 不要只改数字。
[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.141.0"
uvicorn = {extras = ["standard"], version = "^0.53.0"}
pydantic = "^2.13.0"
pydantic-settings = "^2.15.0"
sqlalchemy = "^2.0.54"
asyncpg = "^0.31.0"
alembic = "^1.20.0"
redis = "^5.3.1"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
httpx = "^0.28.1"
python-multipart = "^0.0.32"
loguru = "^0.7.3"
prometheus-client = "^0.26.0"
structlog = "^26.1.0"
arq = "^0.28.0"
langfuse = "^2.60.10"
# CP11.0.8 P3.3: PDF 抓取器依赖
pypdf = "^6.19.0"
# CP-AGENT-RUNNER-INTEGRATION：蒸馏走 LangGraph agent（ai-service/agent/runner.py
# 的 StateGraph / END / START，distill_task → _run_distill_via_agent → agent_app）。
#
# 这一条是**补记**：代码一直在用它，但它从未出现在本文件里，只存在于某台机器的
# venv 里（当初手工装的）。后果不是「少装个包」，而是按本文件装依赖的新环境
# **根本跑不起蒸馏** —— ai-service 的主链路一 import 就 ModuleNotFoundError。
# CI 直到把 tests/ 真正跑起来才暴露出来（5 个测试模块在 collection 期报错）。
aiofiles = "^24.1.0"
langgraph = "^1.2.14"
# ── 以下四个是「运行时惰性 import，但确实要装」的功能依赖 ──────────────────
#
# 它们的 import 都写在函数体里（配 clear 的报错文案），所以缺包时不会在启动
# 阶段炸，而是等到用户真的用到那个功能才炸 —— 这恰恰是最难排查的形态：
# 「部署好好的，一剪藏就 500，日志里只有一行 ModuleNotFoundError」。
#
# CI 把 tests/ 真正跑起来后才发现这几个全都没声明（和 langgraph 一批）。
# 放在主依赖而不是 extras：放 extras 意味着 CI 永远装不上、这些代码路径永远
# 测不到，那才是真正的隐患。惰性 import 保留 —— 不为没人用的功能付启动开销。

# app/services/storage/oss.py：S3/SeaweedFS/OSS 存取。
# 注意 storage_provider 默认就是 "oss"（common/config.py），也就是**默认路径**
# 需要它，不是「可选的边缘 provider」。
boto3 = "^1.43"
# app/services/tts/edge.py：Edge TTS 音色合成
#
# ⚠️ **必须 >= 7.3.1**（2026-10-21 实测）：
#    7.2.x 连微软的 WebSocket 端点会被拒：
#      aiohttp.client_exceptions.WSServerHandshakeError: 403, message='Invalid response status'
#      url='wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1?...'
#    7.3.1 修复（实测合成出 16~23 KB 音频）。
#    ⚠️ 这个故障的表现极具迷惑性：本地 1224 个用例全绿
#    （测试用 mock/录制样本，不真连 edge），
#    但生产上第一条蒸馏就会挂在 TTS 这一步。
edge-tts = "^7.3.1"
# content-service/fetchers/browser.py：抓取 Tier 2 无头浏览器通道
playwright = "^1.63"
# ai-service/agent/mcp_client.py：agent 的 MCP 工具接入
mcp = "^2.2"
# content-service/fetchers/media_ocr.py：图片缩放 / 透明底贴白底。
#
# ⚠️ 2026-10-25 补记：**这是生产必需依赖，却从未在本文件里声明**，
# 只存在于 `requirements-deploy.txt`（pip freeze 的产物）和各台机器的 venv 里。
# 后果与上面 langgraph / aiofiles 那一批**完全同类**：
# 按本文件装依赖的新环境，识图路径一 import 就 ModuleNotFoundError，
# 而 CI 的 `tests/content/test_media_ocr_memory.py` 三条用例直接 FAILED
# （CI 红了 5 次没人看 ⇒ 信号失效，见安卓 CI 的同类问题）。
#
# 为什么它是主依赖而不是 extras：缩图是**剪藏链路的必经环节**
# （正文里的配图要缩到 VLM 用得上的尺寸），不是可选功能。
pillow = "^12.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
ruff = "^0.7.4"
mypy = "^1.13.0"
# tests/test_openapi_export.py 用（CP6.6）。也列在 backend/requirements.txt，
# 但 CI 走 `poetry install`，不装 requirements.txt —— 缺了会在 collection 阶段
# ImportError 直接中断整轮 pytest（CP6.10 定位）。
openapi-spec-validator = "^0.9.0"
# tests/ai/test_admin_endpoints_b2.py、test_ab_attribution_b4.py 等用
# `sqlite+aiosqlite:///:memory:` 起内存库（那几个模块要验 ORM 层逻辑，
# 不值得为此起真 PG）。之前它只存在于某台机器的 venv 里，CI 上那 20 多个用例
# 在 fixture 里直接 ModuleNotFoundError。
aiosqlite = "^0.22"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ⚠️ marker 表达式**只在这里定义一次**（CI 的 workflow 里不再写 `-m`）。
#
# 为什么放 addopts 而不是 workflow：pytest 的 `-m` 是单值选项
# （`action="store"`）⇒ **命令行上的 `-m` 会覆盖 addopts 里的**。
# 以前 workflow 写 `-m "not network"`、本地什么都不写 ⇒ CI 与本地的
# 「跑哪些用例」是**两套口径**，只靠人记着。⇒ 现在两边都吃同一份 addopts：
#   · CI（workflow 不带 -m）→ 用这一份
#   · 本地 `pytest tests/`      → 用这一份
#   · 显式 opt-in（`-m integration` / `-m network`）→ 命令行覆盖 addopts
#
# 两条排除各管一类「会污染环境 / 会拖死 job」的用例：
#   · network     —— 真出网，打的是 example.com / techcrunch.com 等 10 个真实站点
#   · integration —— 需要活的本地服务，会**真的建文章、真的派蒸馏任务**
#     （真 LLM + 真 TTS，单篇 100~250s；e2e 的 arq 队列是全栈共享的，
#      一次全量 pytest 就会给它灌 4~10 个任务，把后面任何一次集成测试的
#      等待时间拖长 —— 2026-10-25 实测有个任务在队列里排了 1381 秒）
addopts = '-m "not network and not integration"'
# network：会真的发起公网请求的用例。
#
# 为什么要显式注册而不是在 workflow 里写死路径：`content-service/tests/integration/
# test_fetch_e2e.py` 打的是 example.com / techcrunch.com / news.sina.com.cn 等
# 10 个真实站点。在 CI 里跑它，后果不是「慢」，而是整个 job 被外部站点拖死或
# 因网络抖动随机变红 —— 而它对「本仓代码有没有坏」这件事又提供不了稳定信号。
#
# 之前这批用例连同 content-service/tests 整目录被 `--ignore` 挡在 CI 之外，
# 于是连**不**出网的 139 个用例也跟着一起失去了信号。改成标记之后，
# 该跑的跑、该排除的排除，且排除依据写在代码里而不是写在注释里。
markers = [
    "network: 真的访问公网，默认排除（-m 'not network' 可显式跑）",
    # content-service/tests/integration/test_fetch_e2e.py 在用，但一直没注册。
    # 未注册不会报错（除非开 --strict-markers），只会每次跑都吐一条
    # PytestUnknownMarkWarning —— 而这正是「标记写了、没人看得见」的那类隐患：
    # 真到有人靠标记做筛选时，它并不会报错，只是静默不生效。
    "integration: 需要多服务/跨服务边界的集成用例，默认排除（-m 'integration' 可显式跑）",
    # ⚠️ `tests/e2e/`（真机走查）**故意不打** integration —— 它的走查命令
    #    （README 里那条，不带 -m）会被 addopts 的 "not integration" 静默清空
    #    （实测：全打 ⇒ no tests collected (35 deselected)，且**不报错**）。
    #    它靠 conftest 的生产端口守卫实现「默认不跑」。详见 tests/e2e/README.md。
    #    `device` / `slow` 两个标记由 tests/e2e/conftest.py 运行时注册，
    #    不在这里（实测 PytestUnknownMarkWarning = 0）。
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# 这两个文件在 import stashbox.* 之前必须先改 sys.path（CP-ENV-CWD：
# 服务以 `python -m uvicorn <svc>.main:app` 从各自目录启动，仓库根不在
# 默认 import 路径上）。E402 在这里是有意为之，不是笔误。
"api-gateway/main.py" = ["E402"]
"ai-service/distill/steps.py" = ["E402"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
