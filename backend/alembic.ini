# Alembic 配置（stashbox 后端迁移）
#
# sqlalchemy.url 在 alembic/env.py 中会被 settings.database_url 覆盖，
# 这里仅作本地兜底默认值（与 backend/common/config.py 一致）。
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# 本地开发默认（asyncpg）。env.py 会用 settings.database_url 覆盖。
sqlalchemy.url = postgresql+asyncpg://stashbox:stashbox_dev@localhost:5432/stashbox

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
